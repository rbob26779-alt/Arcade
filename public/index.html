<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Arcade Hub 3.0</title><link rel="stylesheet" href="/style.css"><header><h1>🎮 Arcade Hub 3.0</h1><nav><button onclick="tab('games')">Games</button><button onclick="tab('party')">Online Party</button><button onclick="tab('leaders')">Leaderboard</button><button onclick="tab('account')">Account</button></nav></header><main><section id="games"><h2>Choose a game</h2><label>Difficulty <select id="difficulty"><option>Easy</option><option>Medium</option><option>Hard</option><option>Extreme</option><option>Impossible</option></select></label><div id="catalog"></div><article id="play" hidden><h2 id="gametitle"></h2><button onclick="closeGame()">← All games</button><div id="arena"></div></article></section><section id="account" hidden><h2>Account</h2><p id="who">Log in or register</p><div id="auth"><input id="username" placeholder="Username" autocomplete="username"><input id="password" type="password" placeholder="Password" autocomplete="current-password"><button onclick="auth('login')">Log in</button><button onclick="auth('register')">Create account</button></div><button id="logout" hidden onclick="logout()">Log out</button><p id="authmsg"></p></section><section id="party" hidden><h2>Online Party</h2><p>Invite a friend to play Tic-Tac-Toe or Connect Four online.</p><button onclick="createParty()">Create party</button><input id="joincode" placeholder="Party code"><button onclick="joinParty()">Join party</button><div id="partyinfo"></div><div id="onlineboard"></div></section><section id="leaders" hidden><h2>Leaderboard</h2><div id="scores"></div><button onclick="loadLeaders()">Refresh</button></section></main><footer>Arcade Hub 3.0 · Don't reuse important passwords</footer><script src="/socket.io/socket.io.js"></script><script src="/app.js"></script></html>
